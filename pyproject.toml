[project]
name = "jobfinder"
version = "2.0.0"
description = "Scraping d'offres d'emploi, évaluation par LLM et suivi des candidatures"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Données
    "pandas>=2.2",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    # Scraping
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "dateparser>=1.2",
    "playwright>=1.45",   # APEC (antibot)
    # LLM
    "openai>=1.40",
    "mistralai>=1.0",
    "ollama>=0.4",
    "backoff>=2.2",
    "aiolimiter>=1.1",
    "langdetect>=1.0.9",
    # Interface
    "nicegui>=4.0,<5",
    "plotly>=5.20",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false  # application, pas une bibliothèque : rien à construire

[tool.pytest.ini_options]
testpaths = ["tests"]
